<style>
:root{--soil:#3b2a1a;--skin:#c8954f;--skin-dk:#a8742f;--flesh:#f6e3a8;--leaf:#5f8a3a;--bg:#f7efd9;--card:#fffaf0;--line:#e3d2a8;--text:#3b2a1a;--muted:#7a6145}
html,body{height:100%;margin:0}
body{display:grid;place-items:center;font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);
background:var(--bg);background-image:radial-gradient(circle at 12% 18%,rgba(168,116,47,.10) 0 6px,transparent 7px),radial-gradient(circle at 78% 72%,rgba(168,116,47,.09) 0 5px,transparent 6px),radial-gradient(circle at 45% 88%,rgba(95,138,58,.08) 0 4px,transparent 5px);background-size:140px 140px,180px 180px,120px 120px}
.box{background:var(--card);padding:30px 28px 26px;border-radius:28px 34px 26px 32px;box-shadow:0 10px 30px rgba(59,42,26,.18),inset 0 0 0 1px var(--line);width:min(340px,88vw);text-align:center}
.logo{width:96px;height:78px;margin:0 auto 6px}
h1{font-size:24px;margin:0;font-weight:800;letter-spacing:.3px;color:var(--soil)}
.sub{margin:4px 0 18px;font-size:14px;color:var(--muted)}
input{width:100%;box-sizing:border-box;padding:12px;font-size:16px;border:2px solid var(--line);border-radius:14px;text-align:center;background:#fff;color:var(--text);outline:none;transition:border-color .15s}
input:focus{border-color:var(--skin)}
button{margin-top:12px;width:100%;padding:12px;font-size:16px;border:0;border-radius:14px;background:linear-gradient(180deg,var(--skin),var(--skin-dk));color:#fff;font-weight:800;cursor:pointer;box-shadow:0 3px 0 #7c5320;transition:transform .08s}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #7c5320}
#err{color:#b0301c;font-size:14px;min-height:20px;margin-top:10px}
#f.hide{display:none}
@media(prefers-color-scheme:dark){:root{--bg:#1c140c;--card:#2a1e12;--line:#4a3620;--text:#f3e6c4;--muted:#c4a77a;--soil:#f6e3a8}input{background:#1c140c}}
